name: Release

# A release is made public only once every system has built: until then it
# is a draft, so the download links and the in-app updater never point at
# files that are not there yet.
on:
  push:
    tags: ["v*"]

permissions:
  contents: write

env:
  # The public repository the downloads live in (the code stays private).
  PUBLIC: itsmrroot/SwiftDM-release

jobs:
  draft:
    runs-on: ubuntu-latest
    steps:
      - name: Draft releases
        env:
          PRIVATE_TOKEN: ${{ github.token }}
          PUBLIC_TOKEN: ${{ secrets.RELEASES_TOKEN }}
        run: |
          tag="$GITHUB_REF_NAME"
          GH_TOKEN="$PRIVATE_TOKEN" gh release view "$tag" -R "$GITHUB_REPOSITORY" >/dev/null 2>&1 ||
            GH_TOKEN="$PRIVATE_TOKEN" gh release create "$tag" -R "$GITHUB_REPOSITORY" --draft --verify-tag \
              --title "SwiftDM ${tag#v}" --generate-notes
          GH_TOKEN="$PUBLIC_TOKEN" gh release view "$tag" -R "$PUBLIC" >/dev/null 2>&1 ||
            GH_TOKEN="$PUBLIC_TOKEN" gh release create "$tag" -R "$PUBLIC" --draft --target main \
              --title "SwiftDM ${tag#v}" \
              --notes "Downloads for Windows, macOS and Linux — see the [install guide](https://github.com/$PUBLIC#-install)."

  extension:
    needs: draft
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      # The browser extension, for loading "unpacked" and for the stores.
      # Firefox gets background scripts and its own id (see gui/src/browser.rs).
      - name: Package the browser extension
        run: |
          mkdir upload
          ext=gui/assets/browser-extension
          (cd "$ext" && zip -qr "$GITHUB_WORKSPACE/upload/swiftdm-browser-extension-chrome.zip" .)
          cp -R "$ext" firefox
          python3 - <<'PY'
          import json
          m = json.load(open("firefox/manifest.json"))
          m.pop("key", None)
          m["background"] = {"scripts": ["background.js"]}
          m["browser_specific_settings"] = {"gecko": {"id": "swiftdm@itsmrroot.github.io", "strict_min_version": "128.0"}}
          json.dump(m, open("firefox/manifest.json", "w"), indent=2, ensure_ascii=False)
          PY
          (cd firefox && zip -qr "$GITHUB_WORKSPACE/upload/swiftdm-browser-extension-firefox.zip" .)
          ls -la upload
      - name: Upload
        env:
          PRIVATE_TOKEN: ${{ github.token }}
          PUBLIC_TOKEN: ${{ secrets.RELEASES_TOKEN }}
        run: |
          GH_TOKEN="$PUBLIC_TOKEN" gh release upload "$GITHUB_REF_NAME" upload/* -R "$PUBLIC" --clobber
          GH_TOKEN="$PRIVATE_TOKEN" gh release upload "$GITHUB_REF_NAME" upload/* -R "$GITHUB_REPOSITORY" --clobber

  build:
    name: ${{ matrix.target }}
    needs: draft
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          # Windows and macOS packages contain the desktop app and the command
          # line; `installer` adds a setup program / disk image next to them.
          - { os: windows-latest, target: x86_64-pc-windows-msvc, packages: "-p swiftdm -p swiftdm-gui", bins: "swiftdm.exe swiftdm-gui.exe", installer: nsis, label: windows-x64 }
          - { os: windows-latest, target: aarch64-pc-windows-msvc, packages: "-p swiftdm -p swiftdm-gui", bins: "swiftdm.exe swiftdm-gui.exe", installer: nsis, label: windows-arm64 }
          - { os: macos-latest, target: aarch64-apple-darwin, packages: "-p swiftdm -p swiftdm-gui", bins: "swiftdm swiftdm-gui", installer: dmg, label: macos-apple-silicon }
          - { os: macos-latest, target: x86_64-apple-darwin, packages: "-p swiftdm -p swiftdm-gui", bins: "swiftdm swiftdm-gui", installer: dmg, label: macos-intel }
          # Linux: a fully static command line, plus the desktop app (which
          # loads the system's graphics libraries, so it is built for glibc).
          # Built on the oldest supported Ubuntu, because a glibc program only
          # runs on that glibc version or newer: built on 22.04 it runs on
          # Ubuntu 22.04+, Debian 12+, Fedora 36+, Mint 21+.
          - { os: ubuntu-latest, target: x86_64-unknown-linux-musl, packages: "-p swiftdm", bins: "swiftdm" }
          - { os: ubuntu-22.04-arm, target: aarch64-unknown-linux-musl, packages: "-p swiftdm", bins: "swiftdm" }
          - { os: ubuntu-22.04, target: x86_64-unknown-linux-gnu, packages: "-p swiftdm -p swiftdm-gui", bins: "swiftdm-gui", suffix: "-desktop", installer: linux, label: linux-x86_64 }
          - { os: ubuntu-22.04-arm, target: aarch64-unknown-linux-gnu, packages: "-p swiftdm -p swiftdm-gui", bins: "swiftdm-gui", suffix: "-desktop", installer: linux, label: linux-arm64 }
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}
      - if: contains(matrix.target, 'musl')
        run: sudo apt-get update && sudo apt-get install -y musl-tools
      - run: cargo build --release --locked --target ${{ matrix.target }} ${{ matrix.packages }}
      # Binaries linked for Intel on an Apple Silicon runner carry no
      # signature at all: sign them before they go into archives or bundles.
      - if: runner.os == 'macOS'
        run: codesign --force -s - ${{ format('target/{0}/release/swiftdm target/{0}/release/swiftdm-gui', matrix.target) }}
      - name: Package
        shell: bash
        run: |
          name=swiftdm-${GITHUB_REF_NAME}-${{ matrix.target }}${{ matrix.suffix }}
          mkdir "$name"
          for b in ${{ matrix.bins }}; do cp "target/${{ matrix.target }}/release/$b" "$name/"; done
          # The users' README, not the developers'.
          cp release-page/README.md "$name/README.md"
          cp LICENSE "$name/"
          # The desktop app embeds Noto Sans Arabic, whose licence must travel with it.
          if [[ "${{ matrix.bins }}" == *swiftdm-gui* ]]; then
            cp gui/assets/fonts/OFL.txt "$name/OFL-NotoSansArabic.txt"
          fi
          mkdir upload
          if [[ "${{ runner.os }}" == "Windows" ]]; then
            7z a "upload/$name.zip" "$name" >/dev/null
          else
            tar czf "upload/$name.tar.gz" "$name"
          fi

      - name: Install packaging tools
        if: matrix.installer
        shell: bash
        run: |
          cargo install --locked cargo-packager@0.11.8
          if [[ "${{ matrix.installer }}" == linux ]]; then cargo install --locked cargo-generate-rpm@0.21.0; fi
      - name: Build installers
        if: matrix.installer
        shell: bash
        env:
          # linuxdeploy is itself an AppImage; this lets it run without FUSE.
          APPIMAGE_EXTRACT_AND_RUN: 1
        run: |
          # No version in the name, so that the README can link to
          # releases/latest/download/<name> and always get the newest one.
          base=swiftdm-${{ matrix.label }}
          # cargo-packager takes its output folder relative to gui/.
          pkg=gui/pkg
          pack="cargo packager --release --target ${{ matrix.target }} -p swiftdm-gui -o pkg"
          mkdir installers
          case "${{ matrix.installer }}" in
            nsis)
              $pack -f nsis
              cp "$pkg"/*.exe "installers/$base-setup.exe" ;;
            dmg)
              $pack -f app,dmg
              # A bundle that fails this check opens as "damaged" after download.
              codesign --verify --deep --strict --verbose=2 "$pkg"/*.app
              cp "$pkg"/*.dmg "installers/$base.dmg" ;;
            linux)
              $pack -f deb,appimage
              cargo generate-rpm -p gui --target ${{ matrix.target }} -o "$GITHUB_WORKSPACE/$pkg"
              cp "$pkg"/*.deb "installers/$base.deb"
              cp "$pkg"/*.AppImage "installers/$base.AppImage"
              cp "$pkg"/*.rpm "installers/$base.rpm" ;;
          esac
          ls -la installers
          cp installers/* upload/

      - name: Upload
        shell: bash
        env:
          PRIVATE_TOKEN: ${{ github.token }}
          PUBLIC_TOKEN: ${{ secrets.RELEASES_TOKEN }}
        run: |
          command -v gh >/dev/null || { sudo apt-get update && sudo apt-get install -y gh; }
          GH_TOKEN="$PUBLIC_TOKEN" gh release upload "$GITHUB_REF_NAME" upload/* -R "$PUBLIC" --clobber
          GH_TOKEN="$PRIVATE_TOKEN" gh release upload "$GITHUB_REF_NAME" upload/* -R "$GITHUB_REPOSITORY" --clobber

  publish:
    needs: [build, extension]
    runs-on: ubuntu-latest
    steps:
      - name: Publish releases
        env:
          PRIVATE_TOKEN: ${{ github.token }}
          PUBLIC_TOKEN: ${{ secrets.RELEASES_TOKEN }}
        run: |
          GH_TOKEN="$PUBLIC_TOKEN" gh release edit "$GITHUB_REF_NAME" -R "$PUBLIC" --draft=false --latest
          GH_TOKEN="$PRIVATE_TOKEN" gh release edit "$GITHUB_REF_NAME" -R "$GITHUB_REPOSITORY" --draft=false --latest
